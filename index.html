<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOUN Classroom Monitor</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="app-header">
  <h1 data-i18n="title">Classroom Monitor</h1>
  <div class="semester-picker">
    <label for="semesterSelect" data-i18n="semester">Semester</label>
    <select id="semesterSelect"></select>
  </div>
  <div class="mode-toggle" role="tablist">
    <button type="button" class="mode-btn" id="modeAvailable" role="tab" data-mode="available" data-i18n="modeAvailable">Available Classrooms</button>
    <button type="button" class="mode-btn" id="modeSchedule" role="tab" data-mode="schedule" data-i18n="modeSchedule">Room Schedule</button>
  </div>
  <div class="header-right">
    <span class="clock" id="clock"></span>
    <div class="lang-toggle" role="group" aria-label="Language">
      <button type="button" class="lang-btn" data-lang="en">EN</button>
      <button type="button" class="lang-btn" data-lang="tr">TR</button>
    </div>
  </div>
</header>

<p class="notice" data-i18n="disclaimerShort">Unannounced room reservations may not be reflected here.</p>

<!-- Available Classrooms -->
<main class="view" id="availableView" hidden>
  <section class="panel controls">
    <div class="control building-control">
      <label for="availBuildingSelect" data-i18n="building">Building</label>
      <select id="availBuildingSelect"></select>
    </div>

    <div class="control time-control">
      <span class="control-label" data-i18n="timeSlot">Time slot</span>
      <div class="time-nav">
        <button type="button" class="nav-btn" id="prevHour" data-i18n-title="prevHour" title="Previous hour">‹</button>
        <div class="time-display">
          <div class="time-big" id="timeBig">--:--</div>
          <div class="time-detail" id="timeDetail"></div>
        </div>
        <button type="button" class="nav-btn" id="nextHour" data-i18n-title="nextHour" title="Next hour">›</button>
        <button type="button" class="now-btn" id="nowBtn" data-i18n="now">Now</button>
      </div>
    </div>

    <div class="control">
      <span class="control-label" data-i18n="consecutive">Free for</span>
      <div class="segmented" id="slotButtons">
        <button type="button" data-slots="1"></button>
        <button type="button" data-slots="2"></button>
        <button type="button" data-slots="3"></button>
      </div>
    </div>

    <label class="checkbox control">
      <input type="checkbox" id="showBusy">
      <span data-i18n="showBusy">Show rooms in use</span>
    </label>
  </section>

  <div id="availableResults"></div>
</main>

<!-- Room Schedule -->
<main class="view app-main" id="scheduleView" hidden>
  <aside class="sidebar">
    <section class="panel room-panel">
      <h2 data-i18n="findRoom">Find a room</h2>
      <input type="text" id="roomSearch" class="text-input" autocomplete="off" data-i18n-placeholder="findRoomPlaceholder">
      <div class="room-matches" id="roomMatches"></div>
      <div class="select-row">
        <div class="control">
          <label for="buildingSelect" data-i18n="building">Building</label>
          <select id="buildingSelect"></select>
        </div>
        <div class="control">
          <label for="roomSelect" data-i18n="room">Room</label>
          <select id="roomSelect" disabled></select>
        </div>
      </div>
    </section>

    <section class="panel search-panel">
      <h2 data-i18n="courseSearch">Find a course</h2>
      <div class="search-bar">
        <input type="text" id="courseSearch" class="text-input" autocomplete="off" data-i18n-placeholder="courseSearchPlaceholder">
      </div>
      <!-- The scroller is the wrapper, not #courseResults: app.js replaces the
           innerHTML of #courseResults, which would destroy the scrollbar that
           scrollview.js puts inside it. -->
      <div class="results-scroll" data-scrollview>
        <div class="results" id="courseResults"></div>
      </div>
    </section>
  </aside>

  <section class="panel schedule-panel">
    <div class="schedule-head" id="scheduleHead"></div>
    <div class="grid-wrap">
      <table class="grid" id="grid"></table>
    </div>
  </section>
</main>

<footer class="app-footer">
  <p class="footer-luck" data-i18n="footerLuck"></p>
  <p data-i18n-html="footerText"></p>
  <p class="footer-meta" id="dataUpdated"></p>
</footer>

<script src="data/manifest.js"></script>
<script src="i18n.js"></script>
<script src="rooms.js"></script>
<script src="scrollview.js"></script>
<script src="app.js"></script>
</body>
</html>
